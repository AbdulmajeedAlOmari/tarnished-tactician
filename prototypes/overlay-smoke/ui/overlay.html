<!doctype html>
<!-- PROTOTYPE overlay page: a transparent full-monitor window with a frame and a HUD. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px/1.35 Consolas, monospace; color: #fff; user-select: none; }
  /* The magenta frame makes black-background bugs and mis-sized windows obvious at a glance. */
  #frame { position: fixed; inset: 0; border: 3px solid #ff00ff; box-sizing: border-box; pointer-events: none; }
  #hud { position: fixed; top: 80px; right: 24px; width: 380px; padding: 10px 12px;
    background: rgba(10, 12, 20, 0.72); border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; }
  #hud b { color: #ffd166; }
  .bad { color: #ff6b6b; font-weight: bold; }
  .ok { color: #8ce99a; }
  #interactive { display: none; position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
    padding: 24px; background: rgba(120, 20, 20, 0.85); border: 2px solid #fff; border-radius: 8px; text-align: center; font-size: 16px; }
  #interactive button { font-size: 18px; padding: 10px 24px; margin-top: 12px; }
  #spinner { position: fixed; bottom: 24px; right: 24px; width: 40px; height: 40px; border: 4px solid #ffd166;
    border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="root">
  <div id="frame"></div>
  <div id="hud">
    <div><b>TT overlay smoke test (PROTOTYPE)</b></div>
    <div>uptime <span id="t">-</span>s · frames <span id="frames">0</span> · <span id="mode">1 Hz</span></div>
    <div id="hk"></div>
    <div>fg: <span id="fg">-</span></div>
    <div>overlay above game: <span id="z">-</span> (bad <span id="zbad">0</span>/<span id="zs">0</span>)</div>
    <div>overlay became fg: <span id="ofg">0</span> · game lost fg to us: <span id="glf">0</span></div>
    <div>RAM tree: <span id="ram">-</span></div>
    <div>mouse events seen by overlay: <span id="mouse">0</span></div>
  </div>
  <div id="spinner"></div>
  <div id="interactive">
    INTERACTIVE MODE (10 s): click-through is OFF.<br>
    Click the button. Did the game also react?
    <br><button id="btn">Test click (<span id="clicks">0</span>)</button>
  </div>
</div>
<script>
  const { listen } = window.__TAURI__.event;
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  let frames = 0, stress = false, mouse = 0, clicks = 0, lastReported = 0;

  function cls(el, good) { el.className = good ? 'ok' : 'bad'; }

  listen('telemetry', ({ payload: t }) => {
    $('t').textContent = t.t;
    $('hk').innerHTML = t.hotkeys.map(h =>
      `${h.name}: RH <span class="${h.rh < h.ll ? 'bad' : ''}">${h.rh}</span> / LL ${h.ll}`).join('<br>');
    $('fg').textContent = t.foreground ? `${t.foreground.exe} "${t.foreground.title}"` : '-';
    $('z').textContent = t.overlay_above_game ?? 'no game';
    if (t.overlay_above_game !== null) cls($('z'), t.overlay_above_game);
    $('zbad').textContent = t.z_bad; $('zs').textContent = t.z_samples;
    $('ofg').textContent = t.overlay_became_fg; cls($('ofg'), t.overlay_became_fg === 0);
    $('glf').textContent = t.game_lost_fg_to_us;
    $('ram').textContent = `${t.mem.working_set_mb} MB ws / ${t.mem.private_mb} MB private / ${t.mem.processes} procs`;
    if (!stress) $('frames').textContent = ++frames;
  });

  listen('state', ({ payload: s }) => {
    $('root').classList.toggle('hidden', !s.hud);
    $('interactive').style.display = s.interactive ? 'block' : 'none';
    $('mode').textContent = s.stress ? 'STRESS 60 fps' : '1 Hz';
    if (s.stress && !stress) { stress = true; requestAnimationFrame(tick); }
    stress = s.stress;
  });

  function tick() {
    if (!stress) return;
    $('frames').textContent = ++frames;
    $('hud').style.borderColor = `hsl(${frames % 360} 80% 60%)`;
    requestAnimationFrame(tick);
  }

  // With click-through on, the overlay should never see a mouse event.
  for (const ev of ['pointerdown', 'pointermove', 'wheel']) {
    document.addEventListener(ev, (e) => {
      mouse++; $('mouse').textContent = mouse;
      if (e.type === 'pointerdown' || Date.now() - lastReported > 1000) {
        lastReported = Date.now();
        invoke('page_report', { kind: 'mouse', data: { type: e.type, total: mouse } });
      }
    });
  }
  $('btn').addEventListener('click', () => {
    $('clicks').textContent = ++clicks;
    invoke('page_report', { kind: 'test_click', data: { clicks } });
  });
</script>
</body>
</html>
